name: Build Advocate Diary APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor project
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          convert icon.jpg -resize 1024x1024! assets/icon.png
          convert splash.jpg -resize 2732x2732! assets/splash.png
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/assets
          npx cap init "Advocate Diary" com.advocate.diary --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          M=android/app/src/main/AndroidManifest.xml
          for p in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$p\"" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\"/>\n    <application#" $M
          done
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AdvocateDiary-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
