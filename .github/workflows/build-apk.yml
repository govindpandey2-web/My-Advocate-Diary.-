name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android project banao
        run: |
          mkdir -p www
          cp index.html icon.jpg splash.jpg www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Advocate Diary" com.govind.advocatediary --web-dir=www
          npx cap add android

      - name: Debug APK build karo
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Advocate-Diary-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
